services:
  postgres:
    image: postgres:17-alpine
    container_name: obrail-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mspr2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./talend/dump/dump_mspr2.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Fenêtre de grâce pendant le chargement du dump SQL initial : évite que
      # les sondes échouées durant l'init soient comptées comme un échec de
      # santé (cause de flaky E2E en CI : "obrail-postgres is unhealthy").
      start_period: 30s
    restart: unless-stopped
    networks:
      - obrail

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: obrail-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-mspr2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:8501}
    volumes:
      - ./ml:/app/ml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - obrail

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: obrail-frontend
    environment:
      # En réseau Docker, le backend est accessible via son nom de service
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - obrail

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: obrail-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - obrail

  grafana:
    image: grafana/grafana:11.3.0
    container_name: obrail-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required (set it in .env)}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3010:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - obrail

  # Collecteur optionnel : scrape le /metrics du backend (Render en prod) et
  # pousse vers Grafana Cloud. Démarrage explicite via le profil "cloud" :
  #   docker compose --profile cloud up alloy
  # Ne fait rien tant que les variables GRAFANA_CLOUD_* ne sont pas renseignées.
  alloy:
    image: grafana/alloy:latest
    container_name: obrail-alloy
    profiles: ["cloud"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      BACKEND_METRICS_TARGET: ${BACKEND_METRICS_TARGET:-obrail-backend.onrender.com:443}
      BACKEND_METRICS_SCHEME: ${BACKEND_METRICS_SCHEME:-https}
      BACKEND_METRICS_INSTANCE: ${BACKEND_METRICS_INSTANCE:-obrail-backend-prod}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_PROM_TOKEN: ${GRAFANA_CLOUD_PROM_TOKEN:-}
    ports:
      - "12345:12345"
    restart: unless-stopped
    networks:
      - obrail

networks:
  obrail:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

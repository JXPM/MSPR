[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: tests unitaires purs
    api: tests du client API (avec mocks HTTP)
    charts: tests de génération de graphiques Plotly
filterwarnings =
    ignore::DeprecationWarning

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: |
          (?x)^(
            talend/dump/.*\.sql|
            talend/Jobs/.*\.jar|
            documentations/.*\.(docx|pdf)
          )$
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff (backend)
        files: ^backend/app/
        args: [--fix]
      - id: ruff
        name: ruff (dashboard)
        files: ^dashboard/
        exclude: ^dashboard/tests(_e2e)?/
        args: [--fix]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^talend/.*\.sh$
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: no-hardcoded-secrets-talend
        name: no hardcoded secrets in talend scripts
        entry: bash -c '! grep -rE "(password|PGPASSWORD|secret)\s*=\s*['"'"'\"][^'"'"'\"]+['"'"'\"]" talend/lancement talend/planication talend/execution_etl 2>/dev/null'
        language: system
        pass_filenames: false
        files: ^talend/(lancement|planication|execution_etl)/

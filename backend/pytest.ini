[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: tests qui appellent l'API via TestClient
    unit: tests unitaires purs
    contract: tests des contrats Pydantic
    quality: tests de qualité des données
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

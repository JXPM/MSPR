server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers (bonnes pratiques RGAA + prod)
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header X-XSS-Protection           "1; mode=block"     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Cache longue durée pour les assets hashés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — toute URL inconnue sert index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html ne doit pas être caché agressivement
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy vers l'API backend (même domaine en prod → pas de CORS)
    # Décommenter et adapter selon l'architecture docker-compose
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Erreurs custom
    error_page 404 /index.html;
}

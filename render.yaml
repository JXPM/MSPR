services:
  - type: web
    name: obrail-backend
    runtime: docker
    plan: free
    region: frankfurt
    # Contexte = racine du repo pour embarquer ml/ (modèles + inférence) dans l'image.
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
